name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          # GitHub Linux runner 可能带 nvcc，onnxruntime-node 会去下 404 的 CUDA 包
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      - run: npx tsc --noEmit
      - run: npm audit --audit-level=high
